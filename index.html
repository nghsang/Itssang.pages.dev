<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050707" />
    <title>Itssang — Profile</title>
    <link rel="icon" href="Earth.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="enterScreen" class="enter-screen">
      <div class="enter-content">
        <button id="enterBtn" class="enter-btn">Click To Enter...</button>
      </div>
    </div>

    <!-- Chỉ cần thêm Video.mp4 vào cùng thư mục để thay nền động. -->
    <video
      class="background-video"
      muted
      loop
      playsinline
      preload="metadata"
      aria-hidden="true"
    >
      <source src="Video.mp4" type="video/mp4" />
    </video>

    <div class="background-fallback" aria-hidden="true"></div>
    <div class="video-shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <button
      class="sound-button"
      id="soundButton"
      type="button"
      aria-label="Bật nhạc"
      aria-pressed="false"
    >
      <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
        <path class="sound-wave wave-one" d="M16 9.5a4 4 0 0 1 0 5"></path>
        <path class="sound-wave wave-two" d="M18.8 6.7a8 8 0 0 1 0 10.6"></path>
      </svg>
      <span class="sound-tooltip">Bật nhạc</span>
    </button>
    <!-- Chỉ cần thêm Music.mp3 vào cùng thư mục để nút âm thanh hoạt động. -->
    <audio id="backgroundMusic" loop preload="metadata">
      <source src="Music.mp3" type="audio/mpeg" />
    </audio>

    <main class="profile" aria-label="Trang cá nhân của Itssang">
      <section class="identity">
        <div class="avatar-shell">
          <!-- Thêm Avatar.png và Rong.png vào cùng thư mục để hoàn thiện khung avatar. -->
          <img
            id="avatarImage"
            data-optional-image
            src="Avatar.png"
            alt="Avatar của Itssang"
          />
          <span class="avatar-placeholder" aria-hidden="true">IS</span>
          <img
            class="dragon-frame"
            data-optional-image
            src="Rong.png"
            alt=""
            aria-hidden="true"
          />
        </div>

        <h1>Nguyen Hoang Sang</h1>
        <p class="domain">Itssang.pages.dev</p>
        <p class="location">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"></path>
            <circle cx="12" cy="9" r="2.3"></circle>
          </svg>
          <span class="loc-divider"></span>
          <span>South Korea</span>
        </p>
      </section>

      <button
        class="discord-card"
        id="copyDiscord"
        type="button"
        aria-label="Sao chép tên Discord Itssang_"
      >
        <span class="discord-avatar">
          <img data-optional-image src="Avatar.png" alt="" aria-hidden="true" />
          <span class="avatar-placeholder small" aria-hidden="true">IS</span>
          <span class="status-dot" aria-label="Đang bận"></span>
        </span>
        <span class="discord-info">
          <strong>Itssang_</strong>
          <span
            ><img src="KC.png" alt="" class="diamond" aria-hidden="true" />
            CRVT</span
          >
        </span>
        <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="10" height="10" rx="2"></rect>
          <path
            d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"
          ></path>
        </svg>
        <span class="copy-message" aria-live="polite">Đã sao chép!</span>
      </button>

      <nav class="social-links" aria-label="Liên kết mạng xã hội">
        <a href="mailto:nghsang267@gmail.com" aria-label="Email" title="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
            ></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </a>
        <a
          href="https://discord.com/users/1045550030423085057"
          target="_blank"
          rel="noreferrer"
          aria-label="Discord"
          title="Discord"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.11 13.11 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.373-.292a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.332-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418z"
            ></path>
          </svg>
        </a>
        <a
          href="https://github.com/nghsang"
          target="_blank"
          rel="noreferrer"
          aria-label="GitHub"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
            ></path>
          </svg>
        </a>
        <a
          href="https://x.com/Itssang_X"
          target="_blank"
          rel="noreferrer"
          aria-label="X (Twitter)"
          title="X (Twitter)"
        >
          <img class="earth-icon" src="Earth.png" alt="" aria-hidden="true" />
        </a>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
