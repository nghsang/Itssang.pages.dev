<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050707" />
    <title>Itssang — Profile</title>
    <link rel="icon" href="Earth.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Sora:wght@700;800&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="enterScreen" class="enter-screen">
      <div class="enter-content">
        <button id="enterBtn" class="enter-btn">Click To Enter...</button>
      </div>
    </div>

    <video
      class="background-video"
      muted
      loop
      playsinline
      preload="metadata"
      aria-hidden="true"
    >
      <source src="Video.mp4" type="video/mp4" />
    </video>

    <div class="background-fallback" aria-hidden="true"></div>
    <div class="video-shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <!-- ── High-End Cyber Vinyl Music Player Widget ── -->
    <div class="music-player-widget" id="musicPlayerWidget">
      <div class="vinyl-player-card">
        <!-- 4 Corner Accents -->
        <span class="btn-corner top-left" aria-hidden="true"></span>
        <span class="btn-corner top-right" aria-hidden="true"></span>
        <span class="btn-corner bottom-left" aria-hidden="true"></span>
        <span class="btn-corner bottom-right" aria-hidden="true"></span>

        <!-- Left Side: Controls Panel -->
        <div class="player-controls-panel">
          <!-- Row 1: Equalizer, Time Display & Progress Bar -->
          <div class="progress-section">
            <div class="progress-header">
              <div class="audio-visualizer" aria-hidden="true">
                <span class="eq-bar bar-1"></span>
                <span class="eq-bar bar-2"></span>
                <span class="eq-bar bar-3"></span>
                <span class="eq-bar bar-4"></span>
              </div>
              <span class="time-display" id="timeDisplay"
                >0:00 <span class="time-total">/ 0:00</span></span
              >
            </div>
            <input
              type="range"
              id="progressSlider"
              class="progress-slider"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Thanh thời gian bài hát"
              title="Tua thời gian"
            />
          </div>

          <!-- Row 2: Action Buttons & Volume -->
          <div class="actions-section">
            <div class="playback-buttons">
              <!-- Rewind 10s -->
              <button
                class="control-btn"
                id="seekBackBtn"
                type="button"
                aria-label="Tua lùi 10 giây"
                title="Lùi 10s"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
                  />
                  <text
                    x="12"
                    y="14.5"
                    font-size="6.5"
                    font-weight="800"
                    text-anchor="middle"
                    fill="currentColor"
                  >
                    10
                  </text>
                </svg>
              </button>

              <!-- Play / Pause -->
              <button
                class="control-btn main-play-btn"
                id="playPauseBtn"
                type="button"
                aria-label="Phát / Tạm dừng"
                title="Phát / Tạm dừng"
              >
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                  <polygon points="6 3 20 12 6 21 6 3"></polygon>
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                  <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
              </button>

              <!-- Forward 10s -->
              <button
                class="control-btn"
                id="seekForwardBtn"
                type="button"
                aria-label="Tua tới 10 giây"
                title="Tới 10s"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"
                  />
                  <text
                    x="12"
                    y="14.5"
                    font-size="6.5"
                    font-weight="800"
                    text-anchor="middle"
                    fill="currentColor"
                  >
                    10
                  </text>
                </svg>
              </button>
            </div>

            <!-- Volume Box -->
            <div class="volume-box is-low" id="volumeBox">
              <button
                class="volume-btn"
                id="volumeBtn"
                type="button"
                aria-label="Bật/Tắt tiếng"
                title="Bật/Tắt tiếng"
              >
                <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                  <path
                    class="vol-wave wave-low"
                    d="M15.54 8.46a5 5 0 0 1 0 7.07"
                  ></path>
                  <path
                    class="vol-wave wave-high"
                    d="M19.07 4.93a10 10 0 0 1 0 14.14"
                  ></path>
                  <path class="vol-mute-x" d="M22 9l-6 6M16 9l6 6"></path>
                </svg>
              </button>
              <input
                type="range"
                id="volumeSlider"
                class="volume-slider"
                min="0"
                max="1"
                step="0.01"
                value="0.35"
                aria-label="Âm lượng nhạc"
                title="Âm lượng"
              />
            </div>
          </div>
        </div>

        <!-- Right Side: Glowing Spinning Vinyl Disc with Earth.png (No tonearm needle) -->
        <button
          class="vinyl-disc-btn"
          id="vinylDiscBtn"
          type="button"
          aria-label="Phát / Tạm dừng nhạc"
          title="Bật / Tắt nhạc"
        >
          <div class="vinyl-disc" id="vinylDisc">
            <div class="vinyl-groove-ring"></div>
            <div class="vinyl-center-label">
              <img
                src="Earth.png"
                alt=""
                class="vinyl-art"
                aria-hidden="true"
              />
              <span class="vinyl-spindle"></span>
            </div>
          </div>
        </button>
      </div>
    </div>
    <audio id="backgroundMusic" loop preload="metadata">
      <source src="Music.mp3" type="audio/mpeg" />
    </audio>

    <main class="profile" aria-label="Trang cá nhân của Itssang">
      <span class="card-corner top-left" aria-hidden="true"></span>
      <span class="card-corner top-right" aria-hidden="true"></span>
      <span class="card-corner bottom-left" aria-hidden="true"></span>
      <span class="card-corner bottom-right" aria-hidden="true"></span>

      <section class="identity">
        <div class="avatar-shell">
          <img
            id="avatarImage"
            data-optional-image
            src="Avatar.png"
            alt="Avatar của Itssang"
          />
          <span class="avatar-placeholder" aria-hidden="true">IS</span>
          <img
            class="dragon-frame"
            data-optional-image
            src="Rong.png"
            alt=""
            aria-hidden="true"
          />
        </div>

        <h1>
          <span>Nguyen Hoang</span>
          <span>Sang</span>
        </h1>
        <p class="domain">Itssang.pages.dev</p>
        <p class="location">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"></path>
            <circle cx="12" cy="9" r="2.3"></circle>
          </svg>
          <span class="loc-divider"></span>
          <span>South Korea</span>
        </p>
      </section>

      <button
        class="discord-card"
        id="copyDiscord"
        type="button"
        aria-label="Sao chép tên Discord Itssang_"
      >
        <span class="discord-avatar">
          <img data-optional-image src="Avatar.png" alt="" aria-hidden="true" />
          <span class="avatar-placeholder small" aria-hidden="true">IS</span>
          <span class="status-dot" aria-label="Đang bận"></span>
        </span>
        <span class="discord-info">
          <strong
            >Itssang_
            <span class="diamond-badge"
              ><img
                src="KC.png"
                alt=""
                class="diamond"
                aria-hidden="true" /></span
          ></strong>
          <span>Developer</span>
        </span>
        <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="10" height="10" rx="2"></rect>
          <path
            d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"
          ></path>
        </svg>
        <span class="copy-message" aria-live="polite">Đã sao chép!</span>
      </button>

      <a
        href="https://itsg.pages.dev"
        target="_blank"
        rel="noreferrer"
        class="itsg-link-btn"
        aria-label="ITSG — itsg.pages.dev"
        title="ITSG — itsg.pages.dev"
      >
        <span class="btn-corner top-left" aria-hidden="true"></span>
        <span class="btn-corner top-right" aria-hidden="true"></span>
        <span class="btn-corner bottom-left" aria-hidden="true"></span>
        <span class="btn-corner bottom-right" aria-hidden="true"></span>

        <span class="btn-side-badge" aria-hidden="true">
          <span class="pulse-led"></span>
        </span>
        <span class="itsg-label">ITSG</span>
        <span class="btn-side-badge" aria-hidden="true">
          <span class="pulse-led"></span>
        </span>
      </a>

      <nav class="social-links" aria-label="Liên kết mạng xã hội">
        <a href="mailto:nghsang267@gmail.com" aria-label="Email" title="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
            ></path>
          </svg>
        </a>
        <a
          href="https://discord.com/users/1045550030423085057"
          target="_blank"
          rel="noreferrer"
          aria-label="Discord"
          title="Discord"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.11 13.11 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.373-.292a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.332-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418z"
            ></path>
          </svg>
        </a>
        <a
          href="https://github.com/nghsang"
          target="_blank"
          rel="noreferrer"
          aria-label="GitHub"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
            ></path>
          </svg>
        </a>
        <a
          href="https://x.com/Itssang_X"
          target="_blank"
          rel="noreferrer"
          aria-label="X (Twitter)"
          title="X (Twitter)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            ></path>
          </svg>
        </a>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
